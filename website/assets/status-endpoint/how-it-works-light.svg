<text x="575" y="374" font-size="20">1  Implemented</text>
<text x="575" y="403" font-size="20">2  Deployed</text>
<rect x="35" y="485" width="180" height="85" rx="14" fill="url(#panel)" stroke="#b4cbd8"/>
<text x="125" y="519" text-anchor="middle" font-size="21" font-weight="700">Test agent</text><text x="125" y="549" text-anchor="middle" font-size="17" fill="#345c72">Agent 03</text>
<path d="M223 527H260" class="edge"/>
<rect x="270" y="475" width="230" height="105" rx="14" fill="url(#panel)" stroke="#b4cbd8"/>
<text x="290" y="509" font-size="17" fill="#345c72">Assigned task</text><text x="290" y="546" font-size="20" font-weight="700">Check workflow</text>
