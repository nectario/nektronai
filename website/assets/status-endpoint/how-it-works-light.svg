<rect x="555" y="470" width="250" height="115" rx="14" fill="url(#panel)" stroke="#b4cbd8"/>
<text x="575" y="500" font-size="17" fill="#345c72">Status updates</text>
<text x="575" y="534" font-size="20">1  Blocked</text>
<rect x="930" y="270" width="235" height="194" rx="18" fill="url(#core)" stroke="#6c9fb9" stroke-width="1.5"/>
<g text-anchor="middle"><text x="1047.5" y="314" font-size="25" font-weight="700">Status Endpoint</text><text x="1047.5" y="357" font-size="20">Ordered updates</text><text x="1047.5" y="391" font-size="20">Shared task snapshot</text><text x="1047.5" y="433" font-size="20" font-weight="700" fill="#644913">Goal still in progress</text></g>
<path d="M805 207H845Q875 207 875 237V307Q875 327 895 327H918" class="edge"/>
<path d="M805 367H918" class="edge"/>
<path d="M805 527H845Q875 527 875 497V427Q875 407 895 407H918" class="edge"/>
</g><path d="M1082.5 270V130H12V527" class="pollbus"/><path d="M12 207H58" class="poll"/><path d="M12 367H58" class="poll"/><path d="M12 527H58" class="poll"/><rect x="35" y="598" width="1230" height="39" rx="9" fill="#e7f1f7"/>
<text x="650" y="624" text-anchor="middle" font-size="19">Each agent reports its own work. Status Endpoint brings the reports together.</text>
</g></svg>