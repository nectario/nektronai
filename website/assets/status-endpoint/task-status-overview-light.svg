<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Agents report task status to Status Endpoint</title><desc id="desc">Four agents send progress reports for one task inward to Status Endpoint. Solid coral arrows show reports sent in. Dashed green arrows point back to the agents and show replies when they check for updates with read permission. These replies are agent-initiated reads, not server push. This is an illustration, not live task data.</desc>
<defs><linearGradient id="hub" x2="1" y2="1"><stop stop-color="#e7f2fa"/><stop offset="1" stop-color="#dbe9f4"/></linearGradient><marker id="report-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 11 6 1 11 4 6Z" fill="#b44b43"/></marker><marker id="read-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#34735b" stroke-width="1.8" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="1198" height="618" rx="20" fill="#f5f9fc" stroke="#b9cbd8"/>
<g fill="none" stroke-linecap="round">
<path class="read-reply" d="M472 281C390 275 365 235 306 197" stroke="#34735b" stroke-width="2.8" stroke-dasharray="7 7" marker-end="url(#read-arrow)"/>
<path class="read-reply" d="M728 281C810 275 835 235 894 197" stroke="#34735b" stroke-width="2.8" stroke-dasharray="7 7" marker-end="url(#read-arrow)"/>
<path class="read-reply" d="M472 339C390 349 365 390 306 423" stroke="#34735b" stroke-width="2.8" stroke-dasharray="7 7" marker-end="url(#read-arrow)"/>
<path class="read-reply" d="M728 339C810 349 835 390 894 423" stroke="#34735b" stroke-width="2.8" stroke-dasharray="7 7" marker-end="url(#read-arrow)"/>
<path class="status-report" d="M306 150C395 135 430 190 500 222" stroke="#b44b43" stroke-width="4.5" marker-end="url(#report-arrow)"/>
<path class="status-report" d="M894 150C805 135 770 190 700 222" stroke="#b44b43" stroke-width="4.5" marker-end="url(#report-arrow)"/>
<path class="status-report" d="M306 470C395 485 430 430 500 398" stroke="#b44b43" stroke-width="4.5" marker-end="url(#report-arrow)"/>
<path class="status-report" d="M894 470C805 485 770 430 700 398" stroke="#b44b43" stroke-width="4.5" marker-end="url(#report-arrow)"/>
