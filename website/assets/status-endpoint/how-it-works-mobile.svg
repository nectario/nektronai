<g text-anchor="middle"><text x="180" y="1002" font-size="25" font-weight="700">Status Endpoint</text><text x="180" y="1042" font-size="20">Ordered updates</text><text x="180" y="1075" font-size="20">Shared task snapshot</text><text x="180" y="1118" font-size="20" font-weight="700" fill="#f0d59d">Goal still in progress</text></g>
