<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#050910">
  <title>NektronAI | Coming Soon</title>
  <meta name="description" content="NektronAI is preparing its research site.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100%;
      display:grid;
      place-items:center;
      padding:24px;
      color:#eaf0ff;
      background:
        linear-gradient(180deg, rgba(5,9,16,.54), rgba(5,9,16,.68)),
        url("assets/background_dark.jpg") left top / 2500px auto repeat,
        #050910;
      background-attachment: fixed, fixed, fixed;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main{
      width:min(920px, 100%);
      display:grid;
      gap:24px;
      justify-items:center;
      text-align:center;
    }
    img{
      width:min(760px, 100%);
      height:auto;
      display:block;
      filter: drop-shadow(0 28px 70px rgba(0,0,0,.42));
    }
    p{
      max-width:62ch;
      margin:0;
      color:#aeb8cc;
      font-size:clamp(1rem, 1rem + .2vw, 1.12rem);
      line-height:1.65;
    }
  </style>
</head>
<body>
  <main aria-label="NektronAI coming soon">
    <img src="assets/coming-soon.svg" alt="NektronAI coming soon" width="1200" height="675" decoding="async">
    <p>NektronAI is preparing its research presence. The public site will return when the next phase is ready.</p>
  </main>
</body>
</html>
